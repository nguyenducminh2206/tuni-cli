[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-race"
version = "1.0.0dev0"
description = "Molecular communication through a stochastic diffusion channel"
readme = "SPEC.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24"
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
